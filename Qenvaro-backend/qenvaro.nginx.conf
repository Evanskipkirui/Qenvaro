server {
    listen 80;
    server_name api.yourdomain.com;   # <-- change to your domain/subdomain

    # Redirect all HTTP to HTTPS (certbot will handle this block after --redirect)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.yourdomain.com;   # <-- change to your domain/subdomain

    # SSL certificates — filled in by certbot automatically
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Proxy all requests to the Go binary
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — bump if your heavy endpoints take longer
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Optional: serve /health directly with no proxy overhead
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    access_log  /var/log/nginx/qenvaro_access.log;
    error_log   /var/log/nginx/qenvaro_error.log;
}
