name: Qenvaro Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Qenvaro-frontend/package-lock.json

      - name: Install dependencies
        working-directory: Qenvaro-frontend
        run: npm ci

      - name: Build application
        working-directory: Qenvaro-frontend
        run: npm run build